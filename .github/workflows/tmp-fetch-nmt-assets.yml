name: tmp-fetch-nmt-assets
on:
  pull_request:
    branches: [develop]

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download EN-ES model
        run: |
          mkdir -p bundle/model bundle/wheels
          curl -L --fail --retry 3 -o bundle/es-base.tar.gz https://github.com/alvroga/nmt-model-store/releases/download/es-v1/es-base.tar.gz
          tar -xzf bundle/es-base.tar.gz -C bundle/model
          rm bundle/es-base.tar.gz
          python -m pip download --only-binary=:all: --dest bundle/wheels ctranslate2 sentencepiece
          find bundle -maxdepth 3 -type f -printf '%p %s\n'
      - uses: actions/upload-artifact@v4
        with:
          name: nmt-en-es-bundle
          path: bundle
          retention-days: 1
