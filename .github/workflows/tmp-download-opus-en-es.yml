name: tmp-download-opus-en-es
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download OPUS-MT model
        run: |
          set -euxo pipefail
          mkdir -p model
          python - <<'PY'
          import urllib.request
          urls = [
              'https://object.pouta.csc.fi/OPUS-MT-models/en-es/opus-2019-12-04.zip',
              'https://object.pouta.csc.fi/OPUS-MT-models/en-es/opus-2020-01-16.zip',
          ]
          err=None
          for u in urls:
              try:
                  print('trying',u)
                  urllib.request.urlretrieve(u, 'model/opus-en-es.zip')
                  print('downloaded',u)
                  break
              except Exception as e:
                  print('failed',repr(e)); err=e
          else:
              raise err
          PY
          ls -lh model/opus-en-es.zip
      - uses: actions/upload-artifact@v4
        with:
          name: opus-en-es-model
          path: model/opus-en-es.zip
          retention-days: 1
